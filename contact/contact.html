<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css" />
</head>

<body>
    <div class="contact-us-container">
        <header>
            <h1>Contact Us</h1>
            <p>
                If you have any questions or need assistance, please reach out to us!
            </p>
        </header>

        <section class="contact-form">
            <h2>Get in Touch</h2>
            <form action="#" method="POST" id="contactForm">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name" />

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address" />

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required placeholder="Enter the subject" />

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required placeholder="Enter your message"></textarea>

                <button type="submit" id="submitButton">Send Message</button>
            </form>
        </section>

        <section class="contact-details">
            <h2>Contact Information</h2>
            <p>
                If you prefer, you can reach us using the following contact information:
            </p>
            <ul>
                <li>
                    Email: <a href="mailto:support@alibaba.com">support@alibaba.com</a>
                </li>
                <li>Phone: +1 (800) 123-4567</li>
                <li>Address: 123 Alibaba Street, City, Country</li>
            </ul>
        </section>
    </div>

    <script src="contact.js"></script>
</body>

</html>
