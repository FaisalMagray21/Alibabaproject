<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Page</title>
    <link rel="stylesheet" href="signup.css" />
</head>

<body>
    <div class="registration-container">
        <div>
            <img id="image" src="logo.jpeg" alt="add a logo" srcset="" />
        </div>
        <h1>Register</h1>
        <form action="#" method="POST">
            <label for="country">Country / Region:</label>
            <select id="country" name="country" required>
          <option value="Pakistan">Pakistan</option>
          <option value="India">India</option>
          <option value="USA">USA</option>
          <!-- Add more countries as needed -->
        </select>

            <label for="role">Please select trade role:</label>
            <div class="trade-role">
                <label><input type="radio" name="role" value="buyer" required />
            Buyer</label
          >
          <label
            ><input type="radio" name="role" value="seller" /> Seller</label
          >
        </div>

        <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your email will be set as account name" required />

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Set the login password" required />

                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required />

                <label for="company-name">Company Name:</label>
                <input type="text" id="company-name" name="company-name" placeholder="Enter your company name" />

                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" />

                <label for="phone">Phone:</label>
                <input type="text" id="phone" name="phone" placeholder="Enter your phone number" required />

                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required />
                    <label for="terms">I agree to the Terms of Use and Privacy Policy.</label
          >
        </div>

        <button type="submit" class="submit-button">Create an Account</button>
      </form>
      <p class="info-text">
        Already have an account? <a href="#">Sign in here</a>.
      </p>
    </div>
  </body>
  <script type="module" src="signup.js"></script>
</html>
